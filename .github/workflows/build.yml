name: Arcade Rat Firmware Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup RISC-V Toolchain (JieLi AC791N)
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-riscv64-unknown-elf make python3
        
    - name: Build Firmware
      run: |
        make clean
        make all
        
    - name: Upload .fwsc Artifact
      uses: actions/upload-artifact@v3
      with:
        name: arcade_rat_fm1_build
        path: build/arcade_rat_fm1.fwsc
